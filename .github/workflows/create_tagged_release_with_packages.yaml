name: "Cura-plugin release"

on:
  push:
    tags:
      - "v*"

# Read-only by default; the one job that needs to write widens it for itself below.
permissions:
  contents: read

jobs:
  create-curapackages:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"

    # Creating the release and uploading the .curapackage assets is a write to the
    # repository, so this is the floor rather than an over-grant. It was previously
    # running on the repository default scope, which is broader.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: "build"
          submodules: "recursive"
      - uses: fieldOfView/cura-plugin-packager-action@main
        with:
          source_folder: "build"
          package_info_path: "build/.github/workflows/package.json"
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            *.curapackage
